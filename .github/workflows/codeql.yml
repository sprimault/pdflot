# Analyse de flux, complémentaire de gosec que le job CI exécute déjà : gosec
# reconnaît des motifs, CodeQL suit une donnée depuis son entrée jusqu'à son
# emploi. Sur un service dont l'hypothèse de départ est que tout HTML entrant
# est hostile, et qui construit des chemins de fichiers à partir de ce qu'il
# reçoit, c'est le second qui a des chances de voir quelque chose.
#
# Installé avant qu'il y ait du code, pour qu'il tourne dès la première ligne
# plutôt que sur un paquet déjà écrit.
name: CodeQL

on:
  push:
  pull_request:
  # Une analyse hebdomadaire même sans changement : la base de requêtes évolue,
  # et du code inchangé peut cesser d'être considéré comme sûr.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
