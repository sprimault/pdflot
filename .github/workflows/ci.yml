name: CI

on:
  push:
  pull_request:

# Le jeton du job ne sert qu'à lire le dépôt. Sans cette clause il hérite des
# permissions par défaut, qui suffisent à écrire — c'est ce dont dispose une
# action tierce compromise le temps de son exécution.
permissions:
  contents: read

jobs:
  verifier:
    name: Contrôles
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par empreinte de commit, version en commentaire. Un
      # tag est mutable : celui qui contrôle le dépôt de l'action peut le
      # rediriger, et le code arrive ici avec le jeton du dépôt. Le projet
      # épingle Chromium, les polices et le rastériseur ; laisser flotter le
      # seul code tiers qui s'exécute à chaque poussée serait incohérent.
      # Dependabot suit ces empreintes, sans quoi l'épinglage devient un gel.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
      # Le cache de modules peut avoir été rempli par un job précédent : la
      # vérification confirme que son contenu correspond bien aux sommes de
      # go.sum avant qu'on compile quoi que ce soit.
      - name: Modules
        run: go mod verify
      # Les contrôles passent par le Makefile plutôt que par des commandes
      # recopiées ici. C'est ce qui rend l'alignement structurel : tant que les
      # deux listes existaient côte à côte, elles ont divergé sans bruit — le
      # job refusait un formatage que `make lint` laissait passer.
      - name: Outils
        run: make tools
      - name: Lint
        run: make lint
      - name: Sécurité
        run: make sec
      - name: Vulnérabilités
        run: make vulncheck
      - name: Tests
        run: make test
